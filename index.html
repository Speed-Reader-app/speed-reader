<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reader</title>
    
    <!-- iPhone Full Screen App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Speed Reader">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Check_green_icon.svg/192px-Check_green_icon.svg.png">

    <!-- Libraries for reading PDFs and unzipping EPUBs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f5; }
        .reader-container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 500px; text-align: center; }
        .word-display { font-family: 'Courier New', Courier, monospace; font-size: 42px; font-weight: bold; display: flex; justify-content: center; margin: 40px 0; padding: 20px 0; border-top: 2px solid #e4e4e7; border-bottom: 2px solid #e4e4e7; }
        .prefix { width: 150px; text-align: right; }
        .orp { color: #ef4444; }
        .suffix { width: 150px; text-align: left; }
        .controls { display: flex; flex-direction: column; gap: 20px; }
        .buttons { display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background-color: #3b82f6; color: white; transition: 0.2s; }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .wpm-label { font-weight: bold; font-size: 18px; margin-top: 10px; }
        .file-upload { margin-bottom: 20px; padding: 10px; border: 2px dashed #d4d4d8; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="reader-container">
        <!-- Notice the accept attribute now includes .epub -->
        <div class="file-upload">
            <label for="fileInput"><strong>Upload Book/File: </strong></label>
            <input type="file" id="fileInput" accept=".txt, .pdf, .epub">
        </div>

        <div id="progress" style="color: gray; font-size: 14px;">Word 0 of 0</div>

        <div class="word-display" id="wordDisplay">
            <div class="prefix" id="prefix">Load</div>
            <div class="orp" id="orp">a</div>
            <div class="suffix" id="suffix">file</div>
        </div>

        <div class="controls">
            <input type="range" id="wpmSlider" min="100" max="1000" step="25" value="300">
            <div class="wpm-label"><span id="wpmValue">300</span> WPM</div>

            <div class="buttons">
                <button onclick="rewindSentence()" id="rewindBtn">⏪ Rewind</button>
                <button id="playPauseBtn" onclick="togglePlayback()">Play</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let words = [];
        let currentIndex = 0;
        let isPlaying = false;
        let wpm = 300;
        let playTimeout = null;
        let currentFileName = ""; 

        const prefixEl = document.getElementById("prefix");
        const orpEl = document.getElementById("orp");
        const suffixEl = document.getElementById("suffix");
        const wpmSlider = document.getElementById("wpmSlider");
        const wpmValue = document.getElementById("wpmValue");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const progressEl = document.getElementById("progress");

        // --- EPUB EXTRACTION LOGIC ---
        async function extractEpubText(file) {
            const zip = await JSZip.loadAsync(file);
            const parser = new DOMParser();
            
            // 1. Find where the book's index (OPF file) is located
            const containerXml = await zip.file("META-INF/container.xml").async("string");
            const containerDoc = parser.parseFromString(containerXml, "text/xml");
            const opfPath = containerDoc.getElementsByTagName("rootfile")[0].getAttribute("full-path");
            const opfDir = opfPath.includes("/") ? opfPath.substring(0, opfPath.lastIndexOf("/") + 1) : "";
            
            // 2. Read the OPF file
            const opfXml = await zip.file(opfPath).async("string");
            const opfDoc = parser.parseFromString(opfXml, "text/xml");
            
            // 3. Map all the files in the book
            const manifestItems = opfDoc.getElementsByTagName("item");
            const manifest = {};
            for (let i = 0; i < manifestItems.length; i++) {
                manifest[manifestItems[i].getAttribute("id")] = manifestItems[i].getAttribute("href");
            }
            
            // 4. Read the chapters in the correct order (the spine)
            const spineItems = opfDoc.getElementsByTagName("itemref");
            let fullText = "";
            
            for (let i = 0; i < spineItems.length; i++) {
                const idref = spineItems[i].getAttribute("idref");
                const href = manifest[idref];
                if (href) {
                    const filePath = opfDir + href;
                    const fileInZip = zip.file(decodeURIComponent(filePath));
                    if (fileInZip) {
                        const html = await fileInZip.async("string");
                        // Strip out all the HTML tags and just get the readable text
                        const htmlDoc = parser.parseFromString(html, "text/html");
                        fullText += htmlDoc.body.textContent + " ";
                    }
                }
            }
            return fullText;
        }

        document.getElementById("fileInput").addEventListener("change", async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            currentFileName = file.name;
            progressEl.innerText = "Extracting text... Please wait.";
            playPauseBtn.disabled = true;
            if (isPlaying) togglePlayback();

            if (file.name.toLowerCase().endsWith(".epub")) {
                try {
                    const text = await extractEpubText(file);
                    finalizeLoad(text);
                } catch (error) {
                    progressEl.innerText = "Error reading EPUB file.";
                    console.error(error);
                }
            } else if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = "";

                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(" ");
                            fullText += pageText + " ";
                        }

                        finalizeLoad(fullText);
                    } catch (error) {
                        progressEl.innerText = "Error reading PDF. It might be scanned/images only.";
                        console.error(error);
                    }
                };
                reader.readAsArrayBuffer(file);
                
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    finalizeLoad(e.target.result);
                };
                reader.readAsText(file);
            }
        });

        function finalizeLoad(text) {
            words = text.trim().split(/\s+/).filter(w => w.length > 0);
            
            const savedIndex = localStorage.getItem(currentFileName);
            if (savedIndex !== null && !isNaN(savedIndex)) {
                currentIndex = parseInt(savedIndex);
                if (currentIndex >= words.length) currentIndex = 0;
            } else {
                currentIndex = 0;
            }

            playPauseBtn.disabled = false;
            if (words.length > 0) {
                updateDisplay(words[currentIndex]);
            } else {
                progressEl.innerText = "No text found in this file.";
            }
        }

        wpmSlider.addEventListener("input", function() {
            wpm = parseInt(this.value);
            wpmValue.innerText = wpm;
        });

        function updateDisplay(word) {
            if (!word) return;
            progressEl.innerText = `Word ${currentIndex + 1} of ${words.length}`;
            
            const len = word.length;
            let orpIndex;
            
            if (len === 1) orpIndex = 0;
            else if (len >= 2 && len <= 4) orpIndex = 1;
            else if (len >= 5 && len <= 6) orpIndex = 2;
            else if (len >= 7 && len <= 8) orpIndex = 3;
            else if (len >= 9 && len <= 10) orpIndex = 4;
            else if (len >= 11 && len <= 12) orpIndex = 5;
            else if (len >= 13 && len <= 14) orpIndex = 6;
            else orpIndex = Math.floor(len / 2);

            prefixEl.innerText = word.substring(0, orpIndex);
            orpEl.innerText = word.charAt(orpIndex);
            suffixEl.innerText = word.substring(orpIndex + 1);
        }

        function togglePlayback() {
            if (words.length === 0) return alert("Please upload a file first.");
            
            isPlaying = !isPlaying;
            playPauseBtn.innerText = isPlaying ? "Pause" : "Play";
            playPauseBtn.style.backgroundColor = isPlaying ? "#ef4444" : "#3b82f6";

            if (isPlaying) {
                runEngine();
            } else {
                clearTimeout(playTimeout);
                saveProgress();
            }
        }

        function runEngine() {
            if (!isPlaying || currentIndex >= words.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Play";
                playPauseBtn.style.backgroundColor = "#3b82f6";
                return;
            }

            const currentWord = words[currentIndex];
            updateDisplay(currentWord);

            let baseDelay = (60.0 / wpm) * 1000;
            let multiplier = 1.0;

            if (/[.!?]$/.test(currentWord)) multiplier = 2.0;
            else if (/[,;]$/.test(currentWord)) multiplier = 1.5;

            currentIndex++;
            playTimeout = setTimeout(runEngine, baseDelay * multiplier);
        }

        function rewindSentence() {
            if (isPlaying) togglePlayback(); 
            if (currentIndex === 0) return;

            let searchIndex = Math.max(0, currentIndex - 2);
            while (searchIndex > 0) {
                if (/[.!?]$/.test(words[searchIndex])) {
                    currentIndex = searchIndex + 1;
                    updateDisplay(words[currentIndex]);
                    saveProgress();
                    return;
                }
                searchIndex--;
            }
            currentIndex = 0;
            updateDisplay(words[currentIndex]);
            saveProgress();
        }

        function saveProgress() {
            if (currentFileName && words.length > 0) {
                localStorage.setItem(currentFileName, currentIndex);
            }
        }

        window.addEventListener("beforeunload", saveProgress);
    </script>
</body>
</html>
